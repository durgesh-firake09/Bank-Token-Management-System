
<div class="login-container">
    <div class="card login-card p-4">
      <h4 class="text-center mb-4 text-primary">Token Verification</h4>
      <form [formGroup]="adminloginForm" (ngSubmit)="adminloginSubmit()">
    
        <div class="mb-3">
          <label for="password" class="form-label">Password:</label>
          <input type="password" name="password" class="form-control" id="password" formControlName="password"  required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Serviced</button>
        <button type="submit" class="btn btn-primary w-100">Next</button>
      </form>
   
    </div>
  </div>
