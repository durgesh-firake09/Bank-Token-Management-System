<div class="login-container">
  <div class="card login-card p-4">
    <h4 class="text-center mb-4 text-primary">Account Holder</h4>
    <form [formGroup]="accountHolderForm" (ngSubmit)="accountHolderSubmit()">
      <div class="mb-3">
        <label for="accountNumber" class="form-label">Account Number:</label>
        <input
          type="text"
          name="accountNumber"
          class="form-control"
          id="accountNumber"
          formControlName="accountNumber"
          required
        />
      </div>

      <div class="mb-3">
        <label for="ifsc_code" class="form-label">IFSC Code:</label>
        <input
          type="text"
          name="ifscCode"
          class="form-control"
          id="ifscCode"
          formControlName="ifscCode"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>
  </div>
</div>
